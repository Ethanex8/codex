<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="100%" height="auto" style="background-color: #1e1e2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow markers -->
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9399b2" />
    </marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#89b4fa" />
    </marker>
    <marker id="arrow-s" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fab387" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" fill="#cdd6f4" font-size="19" font-weight="600">Equivalence of Scalar Product Definitions</text>

  <!-- Coordinate Axes: Origin O(160, 380) -->
  <!-- X axis (aligned with r) -->
  <line x1="100" y1="380" x2="620" y2="380" stroke="#9399b2" stroke-width="2" marker-end="url(#arrow-axis)" />
  <text x="635" y="385" fill="#cdd6f4" font-size="18" font-style="italic" font-weight="bold">x</text>

  <!-- Y axis (in the plane of r and s) -->
  <line x1="160" y1="440" x2="160" y2="80" stroke="#9399b2" stroke-width="2" marker-end="url(#arrow-axis)" />
  <text x="155" y="70" fill="#cdd6f4" font-size="18" font-style="italic" font-weight="bold" text-anchor="end">y</text>

  <!-- Origin label -->
  <circle cx="160" cy="380" r="4.5" fill="#cdd6f4" />
  <text x="145" y="400" fill="#cdd6f4" font-size="14" text-anchor="end">O</text>

  <!-- Geometry:
       Origin = (160, 380)
       Vector r: length = 320 along x-axis => (480, 380)
       Vector s: length = 260 at angle θ = 40 deg
         dx = 260 * cos(40°) = 260 * 0.766 = 199 => x = 160 + 199 = 359
         dy = 260 * sin(40°) = 260 * 0.643 = 167 => y = 380 - 167 = 213
  -->

  <!-- Component Projection Lines for s -->
  <!-- Vertical dashed line from s head (359, 213) to x-axis (359, 380) -->
  <line x1="359" y1="213" x2="359" y2="380" stroke="#6c7086" stroke-width="1.8" stroke-dasharray="4,4" />
  <!-- Horizontal dashed line from s head (359, 213) to y-axis (160, 213) -->
  <line x1="160" y1="213" x2="359" y2="213" stroke="#6c7086" stroke-width="1.8" stroke-dasharray="4,4" />

  <!-- Right angle marker at (359, 380) -->
  <path d="M 344 380 L 344 365 L 359 365" fill="none" stroke="#6c7086" stroke-width="1.5" />

  <!-- Shaded projection interval along x-axis: [160, 359] -->
  <rect x="160" y="380" width="199" height="18" fill="#a6e3a1" fill-opacity="0.18" />
  <text x="259" y="415" fill="#a6e3a1" font-size="14" font-weight="bold" text-anchor="middle">s<tspan dy="3" font-size="11">x</tspan><tspan dy="-3"> = s cos θ</tspan></text>

  <!-- Projection label along y-axis -->
  <text x="145" y="295" fill="#a6e3a1" font-size="14" font-weight="bold" text-anchor="end">s<tspan dy="3" font-size="11">y</tspan><tspan dy="-3"> = s sin θ</tspan></text>

  <!-- Vector r along x-axis: from (160, 380) to (480, 380) -->
  <line x1="160" y1="380" x2="473" y2="380" stroke="#89b4fa" stroke-width="4" marker-end="url(#arrow-r)" />
  <text x="495" y="370" fill="#89b4fa" font-size="17" font-weight="bold">r = (r, 0, 0)</text>

  <!-- Vector s at angle θ: from (160, 380) to (359, 213) -->
  <line x1="160" y1="380" x2="354" y2="218" stroke="#fab387" stroke-width="3.5" marker-end="url(#arrow-s)" />
  <text x="370" y="210" fill="#fab387" font-size="17" font-weight="bold">s = (s cos θ, s sin θ, 0)</text>

  <!-- Angle arc θ between r and s at Origin (radius = 65) -->
  <path d="M 225 380 A 65 65 0 0 0 210 338" fill="none" stroke="#f38ba8" stroke-width="2.2" />
  <text x="230" y="355" fill="#f38ba8" font-size="17" font-weight="bold">θ</text>

  <!-- Derivation Summary Card -->
  <rect x="430" y="75" width="270" height="195" rx="8" fill="#181825" stroke="#313244" stroke-width="1.5" />
  <text x="445" y="103" fill="#fab387" font-size="15" font-weight="bold">Evaluation of Components</text>
  <text x="445" y="132" fill="#89b4fa" font-size="13">r = (r, 0, 0)</text>
  <text x="445" y="157" fill="#fab387" font-size="13">s = (s cos θ, s sin θ, 0)</text>
  <line x1="445" y1="172" x2="685" y2="172" stroke="#45475a" stroke-width="1" />
  <text x="445" y="197" fill="#cdd6f4" font-size="13">∑ r<tspan dy="2" font-size="10">i</tspan><tspan dy="-2"> s</tspan><tspan dy="2" font-size="10">i</tspan><tspan dy="-2"> = r</tspan><tspan dy="2" font-size="10">x</tspan><tspan dy="-2"> s</tspan><tspan dy="2" font-size="10">x</tspan><tspan dy="-2"> + r</tspan><tspan dy="2" font-size="10">y</tspan><tspan dy="-2"> s</tspan><tspan dy="2" font-size="10">y</tspan><tspan dy="-2"> + r</tspan><tspan dy="2" font-size="10">z</tspan><tspan dy="-2"> s</tspan><tspan dy="2" font-size="10">z</tspan></text>
  <text x="445" y="222" fill="#cdd6f4" font-size="13">    = (r)(s cos θ) + 0 + 0</text>
  <text x="445" y="250" fill="#a6e3a1" font-size="14" font-weight="bold">    = r s cos θ  ✓</text>
</svg>

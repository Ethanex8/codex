<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9399b2" />
    </marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#89b4fa" />
    </marker>
    <marker id="arrow-s" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fab387" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="520" fill="#1e1e2e" />

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" fill="#cdd6f4" font-size="19" font-weight="600">Equivalence of Scalar Product Definitions</text>

  <!-- Coordinate Axes: Origin O(120, 240) -->
  <!-- X axis (aligned with r) -->
  <line x1="70" y1="240" x2="650" y2="240" stroke="#9399b2" stroke-width="2" marker-end="url(#arrow-axis)" />
  <text x="665" y="245" fill="#cdd6f4" font-size="18" font-style="italic" font-weight="bold">x</text>

  <!-- Y axis (in the plane of r and s) -->
  <line x1="120" y1="280" x2="120" y2="45" stroke="#9399b2" stroke-width="2" marker-end="url(#arrow-axis)" />
  <text x="115" y="38" fill="#cdd6f4" font-size="18" font-style="italic" font-weight="bold" text-anchor="end">y</text>

  <!-- Origin label -->
  <circle cx="120" cy="240" r="4" fill="#cdd6f4" />
  <text x="105" y="260" fill="#cdd6f4" font-size="14" text-anchor="end">O</text>

  <!-- Component Projection Lines for s (s at 36 deg, length 240: dx = 194, dy = 141) -->
  <!-- Vertical dashed line from s head (314, 99) to x-axis (314, 240) -->
  <line x1="314" y1="99" x2="314" y2="240" stroke="#6c7086" stroke-width="1.5" stroke-dasharray="4,4" />
  <!-- Horizontal dashed line from s head (314, 99) to y-axis (120, 99) -->
  <line x1="120" y1="99" x2="314" y2="99" stroke="#6c7086" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Right angle marker at (314, 240) -->
  <path d="M 299 240 L 299 225 L 314 225" fill="none" stroke="#6c7086" stroke-width="1.5" />

  <!-- Shaded projection interval along x-axis: [120, 314] -->
  <rect x="120" y="244" width="194" height="12" fill="#a6e3a1" fill-opacity="0.25" />
  <text x="217" y="275" fill="#a6e3a1" font-size="14" font-weight="bold" text-anchor="middle">sₓ = s cos θ</text>

  <!-- Projection label along y-axis -->
  <text x="105" y="104" fill="#a6e3a1" font-size="14" font-weight="bold" text-anchor="end">sᵧ = s sin θ</text>

  <!-- Vector r along x-axis: from (120, 240) to (500, 240) with extra stroke thickness -->
  <line x1="120" y1="240" x2="492" y2="240" stroke="#89b4fa" stroke-width="4.5" marker-end="url(#arrow-r)" />
  <text x="420" y="228" fill="#89b4fa" font-size="15" font-weight="bold" text-anchor="middle">r = (r, 0, 0)</text>

  <!-- Vector s at angle θ: from (120, 240) to (314, 99) -->
  <line x1="120" y1="240" x2="308" y2="104" stroke="#fab387" stroke-width="3.5" marker-end="url(#arrow-s)" />
  <text x="325" y="92" fill="#fab387" font-size="16" font-weight="bold">s = (s cos θ, s sin θ, 0)</text>

  <!-- Angle arc θ between r and s at Origin (radius = 55) -->
  <path d="M 175 240 A 55 55 0 0 0 164 208" fill="none" stroke="#f38ba8" stroke-width="2" />
  <text x="184" y="222" fill="#f38ba8" font-size="16" font-weight="bold">θ</text>

  <!-- Derivation Summary Card (Bottom Full-Width Stacked Layout: y in [320, 495]) -->
  <rect x="70" y="320" width="580" height="175" rx="10" fill="#181825" stroke="#6c7086" stroke-width="1.5" />
  <text x="95" y="352" fill="#fab387" font-size="16" font-weight="bold">Component Evaluation of the Scalar Product</text>

  <!-- Left Column: Components -->
  <text x="95" y="388" fill="#89b4fa" font-size="14" font-weight="600">r = (r, 0, 0)</text>
  <text x="95" y="416" fill="#fab387" font-size="14" font-weight="600">s = (s cos θ, s sin θ, 0)</text>
  <text x="95" y="444" fill="#9399b2" font-size="13">z-components are zero</text>

  <!-- Divider -->
  <line x1="310" y1="365" x2="310" y2="470" stroke="#45475a" stroke-width="1.5" />

  <!-- Right Column: Dot Product Step-by-Step -->
  <text x="330" y="388" fill="#cdd6f4" font-size="14">∑ r<tspan dy="2" font-size="10">i</tspan><tspan dy="-2"> s</tspan><tspan dy="2" font-size="10">i</tspan><tspan dy="-2"> = r</tspan><tspan dy="2" font-size="10">x</tspan><tspan dy="-2"> s</tspan><tspan dy="2" font-size="10">x</tspan><tspan dy="-2"> + r</tspan><tspan dy="2" font-size="10">y</tspan><tspan dy="-2"> s</tspan><tspan dy="2" font-size="10">y</tspan><tspan dy="-2"> + r</tspan><tspan dy="2" font-size="10">z</tspan><tspan dy="-2"> s</tspan><tspan dy="2" font-size="10">z</tspan></text>
  <text x="330" y="416" fill="#cdd6f4" font-size="14">       = (r)(s cos θ) + (0)(s sin θ) + (0)(0)</text>
  <text x="330" y="452" fill="#a6e3a1" font-size="16" font-weight="bold">       = r s cos θ   ✓</text>
</svg>

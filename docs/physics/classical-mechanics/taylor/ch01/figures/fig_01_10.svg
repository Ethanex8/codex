<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#89b4fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a6e3a1" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f38ba8" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9399b2" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fab387" />
    </marker>
  </defs>

  <!-- Deep Mocha Canvas Background -->
  <rect width="720" height="520" fill="#1e1e2e" />

  <!-- Header -->
  <g transform="translate(35, 40)">
    <text x="0" y="0" fill="#cdd6f4" font-size="18px" font-weight="700">Uniform Circular Motion Kinematics</text>
    <text x="0" y="20" fill="#a6adc8" font-size="13px">Position r(t), velocity v(t), and centripetal acceleration a(t)</text>
  </g>

  <!-- Left Visual Geometry Area: Center at O(180, 310), R = 135 -->
  <g id="geometry">
    <!-- Axes (bounded to x <= 350 for >= 35px buffer to card at 475) -->
    <line x1="35" y1="310" x2="345" y2="310" stroke="#9399b2" stroke-width="1.2" marker-end="url(#arrow-muted)" />
    <line x1="180" y1="475" x2="180" y2="125" stroke="#9399b2" stroke-width="1.2" marker-end="url(#arrow-muted)" />
    <text x="352" y="314" fill="#bac2de" font-size="13px">x</text>
    <text x="176" y="115" fill="#bac2de" font-size="13px">y</text>
    <text x="165" y="325" fill="#bac2de" font-size="13px">O</text>

    <!-- Circular Path (Radius R = 135) -->
    <circle cx="180" cy="310" r="135" fill="none" stroke="#45475a" stroke-width="1.5" stroke-dasharray="5,5" />

    <!-- Counterclockwise rotation indicator arrow on path -->
    <path d="M 180 175 A 135 135 0 0 0 130 185" fill="none" stroke="#fab387" stroke-width="2" marker-end="url(#arrow-orange)" />
    <text x="152" y="165" fill="#fab387" font-size="14px" font-style="italic">ω</text>

    <!-- Initial position at t = 0 -->
    <circle cx="315" cy="310" r="3.5" fill="#6c7086" />
    <text x="305" y="328" fill="#9399b2" font-size="12px">t = 0</text>

    <!-- Angle theta = omega * t arc -->
    <path d="M 218 310 A 38 38 0 0 0 204.4 280.9" fill="#fab387" fill-opacity="0.2" stroke="#fab387" stroke-width="1.6" />
    <text x="224" y="295" fill="#fab387" font-size="13px" font-style="italic">θ = ωt</text>

    <!-- Position vector r(t): from (180, 310) to P(266.8, 206.6) -->
    <line x1="180" y1="310" x2="262" y2="212" stroke="#89b4fa" stroke-width="3" marker-end="url(#arrow-blue)" />
    <text x="208" y="250" fill="#89b4fa" font-size="15px" font-weight="bold" text-anchor="middle">r(t)</text>

    <!-- Projection lines for components of r -->
    <line x1="266.8" y1="206.6" x2="266.8" y2="310" stroke="#6c7086" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="266.8" y1="206.6" x2="180" y2="206.6" stroke="#6c7086" stroke-width="1" stroke-dasharray="3,3" />
    <text x="225" y="328" fill="#89b4fa" font-size="12px" text-anchor="middle">R cos(ωt)</text>
    <text x="172" y="200" fill="#89b4fa" font-size="12px" text-anchor="end">R sin(ωt)</text>

    <!-- Velocity vector v(t): Tangential, angle 140 deg -->
    <line x1="266.8" y1="206.6" x2="210" y2="159" stroke="#a6e3a1" stroke-width="3" marker-end="url(#arrow-green)" />
    <text x="236" y="165" fill="#a6e3a1" font-size="15px" font-weight="bold">v(t)</text>

    <!-- Acceleration vector a(t): Centripetal, pointing back toward O (slightly offset laterally) -->
    <line x1="269.5" y1="208.8" x2="223" y2="264" stroke="#f38ba8" stroke-width="3" marker-end="url(#arrow-red)" />
    <text x="278" y="255" fill="#f38ba8" font-size="15px" font-weight="bold" text-anchor="start">a(t)</text>

    <!-- Particle dot at P -->
    <circle cx="266.8" cy="206.6" r="5" fill="#cdd6f4" stroke="#11111b" stroke-width="1.5" />
    <text x="276" y="202" fill="#cdd6f4" font-size="13px" font-weight="bold">P(t)</text>
  </g>

  <!-- Right Side Card Panel ($x \ge 475$, width 225) -->
  <g transform="translate(475, 75)">
    <rect width="225" height="420" rx="8" fill="#181825" stroke="#6c7086" stroke-width="1.5" />
    
    <!-- Card Header -->
    <text x="16" y="30" fill="#89b4fa" font-size="15px" font-weight="700">Kinematic Relations</text>
    <line x1="16" y1="42" x2="209" y2="42" stroke="#45475a" stroke-width="1" />

    <!-- Card Content -->
    <g transform="translate(16, 60)">
      <!-- Position -->
      <text x="0" y="0" fill="#bac2de" font-size="13px" font-weight="600">1. Position Vector</text>
      <text x="6" y="18" fill="#89b4fa" font-size="12.5px">r(t) = R cos(ωt) x̂ + R sin(ωt) ŷ</text>
      <text x="6" y="34" fill="#9399b2" font-size="12px">|r| = R (constant radius)</text>

      <!-- Velocity -->
      <text x="0" y="62" fill="#bac2de" font-size="13px" font-weight="600">2. Velocity Vector</text>
      <text x="6" y="80" fill="#a6e3a1" font-size="12px">v(t) = dr/dt</text>
      <text x="6" y="98" fill="#a6e3a1" font-size="11.5px">v = −ωR sin(ωt) x̂ + ωR cos(ωt) ŷ</text>
      <text x="6" y="115" fill="#9399b2" font-size="12px">Speed: v = |v| = ωR</text>
      <text x="6" y="130" fill="#9399b2" font-size="12px">v · r = 0 (tangential)</text>

      <!-- Acceleration -->
      <text x="0" y="156" fill="#bac2de" font-size="13px" font-weight="600">3. Acceleration Vector</text>
      <text x="6" y="174" fill="#f38ba8" font-size="12px">a(t) = dv/dt = −ω² r(t)</text>
      <text x="6" y="192" fill="#9399b2" font-size="12px">• Directed toward center O</text>
      <text x="6" y="208" fill="#9399b2" font-size="12px">• Centripetal: a = ω²R = v²/R</text>

      <!-- Divider -->
      <line x1="0" y1="222" x2="193" y2="222" stroke="#313244" stroke-width="1.2" />

      <!-- Physical Properties -->
      <text x="0" y="242" fill="#fab387" font-size="13px" font-weight="600">4. Motion Characteristics</text>
      <text x="6" y="260" fill="#9399b2" font-size="12px">• Magnitude: a = v² / R</text>
      <text x="6" y="276" fill="#9399b2" font-size="12px">• Direction: −r̂ (inward)</text>

      <!-- Highlight Box -->
      <rect x="0" y="290" width="193" height="32" rx="5" fill="#313244" stroke="#fab387" stroke-width="0.8" />
      <text x="10" y="311" fill="#fab387" font-size="12px" font-weight="600">a = −(v²/R) r̂  (centripetal)</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9399b2" />
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#89b4fa" />
    </marker>
    <marker id="arrow-c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f38ba8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="520" fill="#1e1e2e" />

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" fill="#cdd6f4" font-size="19" font-weight="600">Orthogonal Vectors in the xy-Plane (s = ±1)</text>

  <!-- Coordinate Axes: Origin O(180, 260) -->
  <!-- X axis (bounded to x <= 420 for >= 35px buffer to card at 475) -->
  <line x1="80" y1="260" x2="420" y2="260" stroke="#9399b2" stroke-width="2" marker-end="url(#arrow-axis)" />
  <text x="428" y="265" fill="#cdd6f4" font-size="18" font-style="italic" font-weight="bold">x</text>

  <!-- Y axis -->
  <line x1="180" y1="480" x2="180" y2="60" stroke="#9399b2" stroke-width="2" marker-end="url(#arrow-axis)" />
  <text x="165" y="66" fill="#cdd6f4" font-size="18" font-style="italic" font-weight="bold" text-anchor="end">y</text>

  <!-- Component grid guides (x = 1 line at x = 340, Δx = 160) -->
  <line x1="340" y1="100" x2="340" y2="420" stroke="#6c7086" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="180" y1="100" x2="340" y2="100" stroke="#6c7086" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="180" y1="420" x2="340" y2="420" stroke="#6c7086" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- Axis tick marks and labels -->
  <!-- x = 1 -->
  <line x1="340" y1="255" x2="340" y2="265" stroke="#cdd6f4" stroke-width="2" />
  <text x="350" y="280" fill="#cdd6f4" font-size="14" text-anchor="start">1</text>

  <!-- y = 1 (at screen y = 100) -->
  <line x1="175" y1="100" x2="185" y2="100" stroke="#cdd6f4" stroke-width="2" />
  <text x="165" y="105" fill="#cdd6f4" font-size="14" text-anchor="end">1</text>

  <!-- y = -1 (at screen y = 420) -->
  <line x1="175" y1="420" x2="185" y2="420" stroke="#cdd6f4" stroke-width="2" />
  <text x="165" y="425" fill="#cdd6f4" font-size="14" text-anchor="end">-1</text>

  <!-- Origin label -->
  <text x="165" y="280" fill="#cdd6f4" font-size="14" text-anchor="end">O</text>

  <!-- Vector b = x_hat + y_hat (for s = 1): from (180, 260) to (340, 100) -->
  <line x1="180" y1="260" x2="335" y2="105" stroke="#89b4fa" stroke-width="3.5" marker-end="url(#arrow-b)" />
  <text x="350" y="95" fill="#89b4fa" font-size="16" font-weight="bold">b = x̂ + ŷ</text>

  <!-- Vector c = x_hat - y_hat (for s = 1): from (180, 260) to (340, 420) -->
  <line x1="180" y1="260" x2="335" y2="415" stroke="#f38ba8" stroke-width="3.5" marker-end="url(#arrow-c)" />
  <text x="350" y="435" fill="#f38ba8" font-size="16" font-weight="bold">c = x̂ - ŷ</text>

  <!-- Right Angle Marker between b and c at Origin -->
  <path d="M 198 242 L 216 260 L 198 278" fill="none" stroke="#fab387" stroke-width="2" />

  <!-- Angle arcs to x-axis -->
  <!-- +45 deg arc -->
  <path d="M 240 260 A 60 60 0 0 0 222 218" fill="none" stroke="#89b4fa" stroke-width="1.5" />
  <text x="250" y="235" fill="#89b4fa" font-size="13">45°</text>

  <!-- -45 deg arc -->
  <path d="M 240 260 A 60 60 0 0 1 222 302" fill="none" stroke="#f38ba8" stroke-width="1.5" />
  <text x="250" y="295" fill="#f38ba8" font-size="13">-45°</text>

  <!-- Right Info / Derivation Panel ($x \ge 475$) -->
  <rect x="475" y="70" width="225" height="205" rx="8" fill="#181825" stroke="#6c7086" stroke-width="1.5" />
  <text x="490" y="98" fill="#fab387" font-size="15" font-weight="bold">Orthogonality Condition</text>
  <text x="490" y="125" fill="#cdd6f4" font-size="13">b · c = |b||c| cos(90°) = 0</text>
  <text x="490" y="152" fill="#cdd6f4" font-size="13">b · c = (1)(1) + (s)(-s)</text>
  <text x="490" y="177" fill="#cdd6f4" font-size="13">1 - s² = 0 ⟹ s² = 1</text>
  <line x1="490" y1="192" x2="680" y2="192" stroke="#45475a" stroke-width="1" />
  <text x="490" y="215" fill="#a6e3a1" font-size="14" font-weight="bold">s = +1:  b ⊥ c</text>
  <text x="490" y="240" fill="#a6e3a1" font-size="14" font-weight="bold">s = -1:  (vectors swap)</text>
</svg>

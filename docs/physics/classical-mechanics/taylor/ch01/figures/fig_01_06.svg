<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="100%" height="auto" style="background-color: #1e1e2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow markers -->
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9399b2" />
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#89b4fa" />
    </marker>
    <marker id="arrow-c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f38ba8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" fill="#cdd6f4" font-size="19" font-weight="600">Orthogonal Vectors in the xy-Plane (s = ±1)</text>

  <!-- Coordinate Axes: Origin O(200, 260) -->
  <!-- X axis -->
  <line x1="100" y1="260" x2="520" y2="260" stroke="#9399b2" stroke-width="2" marker-end="url(#arrow-axis)" />
  <text x="535" y="265" fill="#cdd6f4" font-size="18" font-style="italic" font-weight="bold">x</text>

  <!-- Y axis -->
  <line x1="200" y1="480" x2="200" y2="50" stroke="#9399b2" stroke-width="2" marker-end="url(#arrow-axis)" />
  <text x="195" y="42" fill="#cdd6f4" font-size="18" font-style="italic" font-weight="bold" text-anchor="end">y</text>

  <!-- Component grid guides (x = 1 line at x = 380, Δx = 180) -->
  <line x1="380" y1="80" x2="380" y2="440" stroke="#6c7086" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="200" y1="80" x2="380" y2="80" stroke="#6c7086" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="200" y1="440" x2="380" y2="440" stroke="#6c7086" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- Axis tick marks and labels -->
  <!-- x = 1 -->
  <line x1="380" y1="255" x2="380" y2="265" stroke="#cdd6f4" stroke-width="2" />
  <text x="380" y="285" fill="#cdd6f4" font-size="14" text-anchor="middle">1</text>

  <!-- y = 1 (at screen y = 80) -->
  <line x1="195" y1="80" x2="205" y2="80" stroke="#cdd6f4" stroke-width="2" />
  <text x="180" y="85" fill="#cdd6f4" font-size="14" text-anchor="end">1</text>

  <!-- y = -1 (at screen y = 440) -->
  <line x1="195" y1="440" x2="205" y2="440" stroke="#cdd6f4" stroke-width="2" />
  <text x="180" y="445" fill="#cdd6f4" font-size="14" text-anchor="end">-1</text>

  <!-- Origin label -->
  <text x="185" y="280" fill="#cdd6f4" font-size="14" text-anchor="end">O</text>

  <!-- Vector b = x_hat + y_hat (for s = 1): from (200, 260) to (380, 80) -->
  <line x1="200" y1="260" x2="375" y2="85" stroke="#89b4fa" stroke-width="3.5" marker-end="url(#arrow-b)" />
  <text x="395" y="80" fill="#89b4fa" font-size="16" font-weight="bold">b = x̂ + ŷ</text>

  <!-- Vector c = x_hat - y_hat (for s = 1): from (200, 260) to (380, 440) -->
  <line x1="200" y1="260" x2="375" y2="435" stroke="#f38ba8" stroke-width="3.5" marker-end="url(#arrow-c)" />
  <text x="395" y="445" fill="#f38ba8" font-size="16" font-weight="bold">c = x̂ - ŷ</text>

  <!-- Right Angle Marker between b and c at Origin -->
  <!-- Arms of size 28 px along b (unit: (1/√2, -1/√2)) and c (unit: (1/√2, 1/√2)) -->
  <path d="M 220 240 L 240 260 L 220 280" fill="none" stroke="#fab387" stroke-width="2" />
  <text x="248" y="265" fill="#fab387" font-size="14" font-weight="bold">90°</text>

  <!-- Angle arcs to x-axis -->
  <!-- +45 deg arc -->
  <path d="M 270 260 A 70 70 0 0 0 250 210" fill="none" stroke="#89b4fa" stroke-width="1.5" />
  <text x="275" y="235" fill="#89b4fa" font-size="13">45°</text>

  <!-- -45 deg arc -->
  <path d="M 270 260 A 70 70 0 0 1 250 310" fill="none" stroke="#f38ba8" stroke-width="1.5" />
  <text x="275" y="295" fill="#f38ba8" font-size="13">-45°</text>

  <!-- Right Info / Derivation Panel -->
  <rect x="495" y="70" width="210" height="200" rx="8" fill="#181825" stroke="#313244" stroke-width="1.5" />
  <text x="510" y="98" fill="#fab387" font-size="15" font-weight="bold">Orthogonality Condition</text>
  <text x="510" y="125" fill="#cdd6f4" font-size="13">b · c = |b||c| cos(90°) = 0</text>
  <text x="510" y="152" fill="#cdd6f4" font-size="13">b · c = (1)(1) + (s)(-s)</text>
  <text x="510" y="177" fill="#cdd6f4" font-size="13">1 - s² = 0 ⟹ s² = 1</text>
  <line x1="510" y1="192" x2="685" y2="192" stroke="#45475a" stroke-width="1" />
  <text x="510" y="215" fill="#a6e3a1" font-size="14" font-weight="bold">s = +1:  b ⊥ c</text>
  <text x="510" y="240" fill="#a6e3a1" font-size="14" font-weight="bold">s = -1:  (vectors swap)</text>
</svg>

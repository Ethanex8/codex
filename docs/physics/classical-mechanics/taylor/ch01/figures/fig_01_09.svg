<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#89b4fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a6e3a1" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fab387" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6c7086" />
    </marker>
  </defs>

  <!-- Deep Mocha Canvas Background -->
  <rect width="720" height="520" fill="#1e1e2e" />

  <!-- Header -->
  <g transform="translate(35, 40)">
    <text x="0" y="0" fill="#cdd6f4" font-size="18px" font-weight="700">Vector Geometry &amp; The Law of Cosines</text>
    <text x="0" y="20" fill="#a6adc8" font-size="13px">Head-to-tail triangle addition: c = a + b with interior angle θ</text>
  </g>

  <!-- Left: Geometry Visual Area (Origin at (70, 390)) -->
  <!-- A = (70, 390), B = (290, 390), C = (195, 160) -->
  <g id="geometry">
    <!-- Shaded Triangle Area -->
    <polygon points="70,390 290,390 195,160" fill="#313244" fill-opacity="0.35" stroke="#45475a" stroke-dasharray="4,4" stroke-width="1.2" />

    <!-- Dashed Extension of vector a past vertex B (bounded to x=390 <= 440) -->
    <line x1="290" y1="390" x2="390" y2="390" stroke="#6c7086" stroke-width="1.5" stroke-dasharray="5,4" />

    <!-- Angle theta (interior at B) -->
    <path d="M 250 390 A 40 40 0 0 1 274.6 353.1" fill="#f38ba8" fill-opacity="0.18" stroke="#f38ba8" stroke-width="1.8" />
    <text x="270" y="380" fill="#f38ba8" font-size="14px" font-style="italic" text-anchor="middle">θ</text>

    <!-- Angle (180 - theta) (exterior between +a extension and b) -->
    <path d="M 335 390 A 45 45 0 0 0 272.7 348.9" fill="#fab387" fill-opacity="0.15" stroke="#fab387" stroke-width="1.8" />
    <text x="345" y="375" fill="#fab387" font-size="14px" font-style="italic">180° − θ</text>

    <!-- Vector a: from (70, 390) to (290, 390) -->
    <line x1="70" y1="390" x2="284" y2="390" stroke="#89b4fa" stroke-width="3.5" marker-end="url(#arrow-blue)" />
    <!-- Vector b: from (290, 390) to (195, 160) -->
    <line x1="290" y1="390" x2="198" y2="167" stroke="#a6e3a1" stroke-width="3.5" marker-end="url(#arrow-green)" />
    <!-- Vector c = a + b: from (70, 390) to (195, 160) -->
    <line x1="70" y1="390" x2="191" y2="167" stroke="#fab387" stroke-width="3.5" marker-end="url(#arrow-orange)" />

    <!-- Vector Labels -->
    <text x="175" y="416" fill="#89b4fa" font-size="16px" font-weight="bold">a</text>
    <text x="255" y="265" fill="#a6e3a1" font-size="16px" font-weight="bold">b</text>
    <text x="110" y="270" fill="#fab387" font-size="15px" font-weight="bold" text-anchor="end">c = a + b</text>

    <!-- Vertex Points -->
    <circle cx="70" cy="390" r="4.5" fill="#cdd6f4" />
    <circle cx="290" cy="390" r="4.5" fill="#cdd6f4" />
    <circle cx="195" cy="160" r="4.5" fill="#cdd6f4" />
  </g>

  <!-- Right: Side Card Panel (x = 475 to 700, w = 225) -->
  <g transform="translate(475, 75)">
    <!-- Card Background -->
    <rect width="225" height="420" rx="8" fill="#181825" stroke="#6c7086" stroke-width="1.5" />

    <!-- Card Header -->
    <text x="16" y="30" fill="#89b4fa" font-size="15px" font-weight="700">Derivation Summary</text>
    <line x1="16" y1="42" x2="209" y2="42" stroke="#45475a" stroke-width="1" />

    <!-- Card Content -->
    <g transform="translate(16, 62)">
      <!-- Step 1 -->
      <text x="0" y="0" fill="#bac2de" font-size="13px" font-weight="600">1. Vector Setup</text>
      <text x="8" y="20" fill="#cdd6f4" font-size="13.5px">c = a + b</text>
      <text x="8" y="38" fill="#9399b2" font-size="12px">Head of a at tail of b</text>

      <!-- Step 2 -->
      <text x="0" y="70" fill="#bac2de" font-size="13px" font-weight="600">2. Vector Identity</text>
      <text x="8" y="90" fill="#cdd6f4" font-size="13px">c² = (a + b) · (a + b)</text>
      <text x="8" y="112" fill="#cdd6f4" font-size="13px">c² = a² + b² + 2(a · b)</text>

      <!-- Step 3 -->
      <text x="0" y="144" fill="#bac2de" font-size="13px" font-weight="600">3. Angle Between Vectors</text>
      <text x="8" y="164" fill="#9399b2" font-size="12px">Interior angle of Δ: θ</text>
      <text x="8" y="180" fill="#9399b2" font-size="12px">Angle between a &amp; b: 180° − θ</text>
      <text x="8" y="204" fill="#cdd6f4" font-size="13px">a · b = ab cos(180° − θ)</text>
      <text x="8" y="226" fill="#cdd6f4" font-size="13px">a · b = −ab cos θ</text>

      <!-- Divider -->
      <line x1="0" y1="242" x2="193" y2="242" stroke="#313244" stroke-width="1.2" />

      <!-- Conclusion -->
      <text x="0" y="262" fill="#fab387" font-size="13px" font-weight="600">4. Law of Cosines</text>
      <rect x="0" y="272" width="193" height="34" rx="6" fill="#313244" stroke="#fab387" stroke-width="1" />
      <text x="8" y="294" fill="#fab387" font-size="13px" font-weight="bold">c² = a² + b² − 2ab cos θ</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#89b4fa" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fab387" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a6e3a1" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6c7086" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="520" fill="#1e1e2e" />

  <!-- LEFT SIDE: 3D Coordinate Geometry -->
  <!-- Origin O = (160, 360) -->
  <!-- Shaded xy plane patch -->
  <polygon points="160,360 390,276 300,226 70,310" fill="#313244" fill-opacity="0.35" stroke="#45475a" stroke-width="1" stroke-dasharray="3 3" />
  <text x="315" y="250" fill="#6c7086" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">xy-plane</text>

  <!-- Coordinate Axes Lines -->
  <!-- x-axis (along r) -->
  <line x1="160" y1="360" x2="415" y2="267" stroke="#6c7086" stroke-width="1.8" marker-end="url(#arrow-muted)" />
  <text x="425" y="272" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">x</text>

  <!-- y-axis -->
  <line x1="160" y1="360" x2="55" y2="302" stroke="#6c7086" stroke-width="1.8" marker-end="url(#arrow-muted)" />
  <text x="42" y="300" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">y</text>

  <!-- z-axis (along r x s) -->
  <line x1="160" y1="360" x2="160" y2="80" stroke="#6c7086" stroke-width="1.8" marker-end="url(#arrow-muted)" />
  <text x="160" y="70" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">z</text>

  <text x="145" y="375" fill="#6c7086" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">O</text>

  <!-- Vector r along x-axis -->
  <line x1="160" y1="360" x2="335" y2="296" stroke="#89b4fa" stroke-width="3.5" marker-end="url(#arrow-blue)" />
  <text x="260" y="340" fill="#89b4fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">r = (r, 0, 0)</text>

  <!-- Vector s in xy-plane -->
  <line x1="230" y1="245" x2="295" y2="311" stroke="#fab387" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="230" y1="245" x2="95" y2="294" stroke="#fab387" stroke-width="1.5" stroke-dasharray="4 4" />

  <line x1="160" y1="360" x2="230" y2="245" stroke="#fab387" stroke-width="3.5" marker-end="url(#arrow-orange)" />
  <text x="215" y="235" fill="#fab387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">s = (s cos θ, s sin θ, 0)</text>

  <!-- Angle theta arc in the xy-plane between r and s -->
  <path d="M 212 341 A 55 25 -20 0 0 182 312" fill="none" stroke="#f38ba8" stroke-width="2" />
  <text x="208" y="322" fill="#f38ba8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">θ</text>

  <!-- Cross Product Vector r x s along +z axis -->
  <line x1="160" y1="360" x2="160" y2="130" stroke="#a6e3a1" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="175" y="150" fill="#a6e3a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">r × s = (0, 0, rs sin θ)</text>
  <text x="175" y="172" fill="#a6e3a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Magnitude: rs sin θ</text>
  <text x="175" y="190" fill="#a6e3a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Direction: +ẑ (Right-Hand Rule)</text>

  <!-- Right Angle Indicators at O -->
  <path d="M 160 335 L 180 328 L 180 353" fill="none" stroke="#6c7086" stroke-width="1.5" />
  <path d="M 160 335 L 140 322 L 140 347" fill="none" stroke="#6c7086" stroke-width="1.5" />

  <!-- Right hand rule badge at bottom left -->
  <g transform="translate(60, 440)">
    <rect x="0" y="0" width="375" height="55" rx="6" fill="#181825" stroke="#313244" stroke-width="1.5" />
    <text x="14" y="23" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Right-Hand Rule &amp; Orthogonality:</text>
    <text x="14" y="42" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Fingers curl from r (along +x̂) to s ⟹ Thumb points along +ẑ</text>
  </g>

  <!-- RIGHT SIDE: Compact Geometric Legend Card ($x \ge 475$) -->
  <rect x="475" y="70" width="225" height="245" rx="8" fill="#181825" stroke="#6c7086" stroke-width="1.5" />

  <!-- Card Title -->
  <text x="492" y="100" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Cross Product Geometry</text>
  <line x1="492" y1="112" x2="683" y2="112" stroke="#45475a" stroke-width="1" />

  <!-- Coordinate Triad -->
  <text x="492" y="138" fill="#fab387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Aligned Coordinate Frame:</text>
  <text x="492" y="162" fill="#89b4fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">r = (r, 0, 0)</text>
  <text x="492" y="186" fill="#fab387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">s = (s cos θ, s sin θ, 0)</text>

  <!-- Vector Result Box -->
  <rect x="487" y="206" width="201" height="85" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.2" />
  <text x="498" y="230" fill="#a6e3a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">r × s = (rs sin θ) ẑ</text>
  <text x="498" y="252" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">• Orthogonal: ẑ ⊥ r and ẑ ⊥ s</text>
  <text x="498" y="270" fill="#89b4fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">• Right-hand orientation</text>
</svg>

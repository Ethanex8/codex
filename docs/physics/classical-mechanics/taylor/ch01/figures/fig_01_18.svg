<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#89b4fa" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fab387" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a6e3a1" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6c7086" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="520" fill="#1e1e2e" />

  <!-- LEFT SIDE: Geometry Setup -->
  <!-- Triangle Vertices:
       A = (70, 360)
       C = (380, 360)
       B = (270, 150)
       Foot of perpendicular D from B to AC: D = (270, 360)
       Height h = 360 - 150 = 210
       Base b = 380 - 70 = 310
  -->

  <!-- Shaded Triangle Area -->
  <polygon points="70,360 380,360 270,150" fill="#89b4fa" fill-opacity="0.08" stroke="#45475a" stroke-width="1.2" />

  <!-- Altitude (Perpendicular dropped from B to base AC) -->
  <line x1="270" y1="150" x2="270" y2="360" stroke="#f38ba8" stroke-width="2.2" stroke-dasharray="5 5" />
  <text x="278" y="255" fill="#f38ba8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">h = a sin γ</text>

  <!-- Right angle indicator at D (270, 360) -->
  <path d="M 255 360 L 255 345 L 270 345" fill="none" stroke="#6c7086" stroke-width="1.5" />
  <circle cx="270" cy="360" r="3.5" fill="#f38ba8" />
  <text x="270" y="380" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">D</text>

  <!-- Extension of vector a past C to show exterior angle pi - gamma -->
  <!-- Vector a is from (270, 150) to (380, 360), dx = 110, dy = 210. Extend by factor 0.35: dx = 38.5, dy = 73.5 -> (418.5, 433.5) -->
  <line x1="380" y1="360" x2="422" y2="440" stroke="#fab387" stroke-width="1.5" stroke-dasharray="4 4" />
  <!-- Angle arc for pi - gamma between extended a and vector b (which points left along -x) -->
  <!-- Direction of extended a: ~62.3 deg below +x (380+40*cos(62.3), 360+40*sin(62.3)) = (398.5, 395.4) -->
  <!-- Direction of b: along -x, i.e. 180 deg (380 - 40, 360) = (340, 360) -->
  <path d="M 398.5 395.4 A 40 40 0 0 1 340 360" fill="none" stroke="#f38ba8" stroke-width="1.8" />
  <text x="365" y="415" fill="#f38ba8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">π − γ</text>

  <!-- Side Vectors -->
  <!-- Vector c (Blue, A -> B) -->
  <line x1="70" y1="360" x2="270" y2="150" stroke="#89b4fa" stroke-width="3.2" marker-end="url(#arrow-blue)" />
  <text x="150" y="240" fill="#89b4fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">c</text>

  <!-- Vector a (Orange, B -> C) -->
  <line x1="270" y1="150" x2="380" y2="360" stroke="#fab387" stroke-width="3.2" marker-end="url(#arrow-orange)" />
  <text x="345" y="245" fill="#fab387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">a</text>

  <!-- Vector b (Green, along base C -> A) -->
  <line x1="380" y1="360" x2="70" y2="360" stroke="#a6e3a1" stroke-width="3.2" marker-end="url(#arrow-green)" />
  <text x="175" y="405" fill="#a6e3a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">b (base AC, length b)</text>

  <!-- Vertices dots & labels -->
  <circle cx="70" cy="360" r="4.5" fill="#cdd6f4" />
  <text x="52" y="375" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">A</text>

  <circle cx="270" cy="150" r="4.5" fill="#cdd6f4" />
  <text x="270" y="132" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">B</text>

  <circle cx="380" cy="360" r="4.5" fill="#cdd6f4" />
  <text x="395" y="360" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">C</text>

  <!-- Interior Angle Arcs -->
  <!-- Angle alpha at A -->
  <path d="M 115 360 A 45 45 0 0 0 102.6 328.9" fill="none" stroke="#89b4fa" stroke-width="1.8" />
  <text x="122" y="352" fill="#89b4fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">α</text>

  <!-- Angle beta at B -->
  <path d="M 255 166 A 35 35 0 0 0 285 177" fill="none" stroke="#fab387" stroke-width="1.8" />
  <text x="270" y="195" fill="#fab387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">β</text>

  <!-- Angle gamma at C (interior between CB and CA) -->
  <path d="M 335 360 A 45 45 0 0 1 361 324" fill="none" stroke="#a6e3a1" stroke-width="1.8" />
  <text x="340" y="348" fill="#a6e3a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">γ</text>

  <!-- Bottom Left Banner -->
  <g transform="translate(60, 442)">
    <rect x="0" y="0" width="375" height="58" rx="6" fill="#181825" stroke="#313244" stroke-width="1.5" />
    <text x="14" y="22" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Loop Closure: a + b + c = 0</text>
    <text x="14" y="42" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Angle between a and b is π − γ ⟹ sin(π − γ) = sin γ</text>
  </g>


  <!-- RIGHT SIDE: Compact Geometric Legend Card ($x \ge 475$) -->
  <rect x="475" y="70" width="225" height="235" rx="8" fill="#181825" stroke="#313244" stroke-width="1.5" />

  <!-- Card Title -->
  <text x="492" y="100" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Geometric Triangle Setup</text>
  <line x1="492" y1="112" x2="683" y2="112" stroke="#45475a" stroke-width="1" />

  <!-- Geometric Elements -->
  <text x="492" y="138" fill="#fab387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Base &amp; Altitude:</text>
  <text x="492" y="162" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">Base: AC = b</text>
  <text x="492" y="184" fill="#f38ba8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">Altitude: h = a sin γ</text>

  <!-- Cross Product Area Box -->
  <rect x="487" y="202" width="201" height="85" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.2" />
  <text x="498" y="226" fill="#fab387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Vector Area Form:</text>
  <text x="498" y="248" fill="#a6e3a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Area = ½ |a × b|</text>
  <text x="498" y="270" fill="#89b4fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">= ½ |b × c| = ½ |c × a|</text>
</svg>

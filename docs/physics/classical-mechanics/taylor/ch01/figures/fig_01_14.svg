<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#89b4fa" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fab387" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a6e3a1" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6c7086" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="520" fill="#1e1e2e" />

  <!-- LEFT SIDE: Geometry Setup (Head-to-tail triangle) -->
  <!-- Points: Tail of a: A = (80, 360), Head of a / Tail of b: B = (280, 360), Head of b: C = (390, 180) -->

  <!-- Shaded Triangle Area -->
  <polygon points="80,360 280,360 390,180" fill="#89b4fa" fill-opacity="0.08" stroke="#45475a" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Extended line along a to illustrate angle theta between a and b -->
  <line x1="280" y1="360" x2="380" y2="360" stroke="#6c7086" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Angle theta arc at vertex B (280, 360) -->
  <path d="M 320 360 A 40 40 0 0 0 300.9 325.9" fill="none" stroke="#f38ba8" stroke-width="2" />
  <text x="328" y="342" fill="#f38ba8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">θ</text>

  <!-- Vector a (Blue) -->
  <line x1="80" y1="360" x2="280" y2="360" stroke="#89b4fa" stroke-width="3.5" marker-end="url(#arrow-blue)" />
  <text x="175" y="390" fill="#89b4fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">a (length a)</text>

  <!-- Vector b (Orange) -->
  <line x1="280" y1="360" x2="390" y2="180" stroke="#fab387" stroke-width="3.5" marker-end="url(#arrow-orange)" />
  <text x="355" y="275" fill="#fab387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">b (length b)</text>

  <!-- Resultant Vector a + b (Green) -->
  <line x1="80" y1="360" x2="390" y2="180" stroke="#a6e3a1" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="210" y="250" fill="#a6e3a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" transform="rotate(-30 210 250)">a + b</text>
  <text x="210" y="270" fill="#a6e3a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" transform="rotate(-30 210 250)">length |a + b|</text>

  <!-- Vertices markers and labels -->
  <circle cx="80" cy="360" r="4" fill="#cdd6f4" />
  <text x="65" y="375" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Tail(a)</text>

  <circle cx="280" cy="360" r="4" fill="#cdd6f4" />
  <text x="270" y="415" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Head(a) / Tail(b)</text>

  <circle cx="390" cy="180" r="4" fill="#cdd6f4" />
  <text x="400" y="175" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Head(b)</text>

  <!-- Degenerate Collinear Case Note below triangle -->
  <g transform="translate(80, 445)">
    <rect x="0" y="0" width="365" height="50" rx="6" fill="#181825" stroke="#313244" stroke-width="1.5" />
    <text x="14" y="22" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Equality condition (θ = 0°):</text>
    <text x="14" y="40" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Triangle flattens into line segment ⟹ |a + b| = a + b</text>
  </g>

  <!-- RIGHT SIDE: Info / Derivation Card ($x \ge 475$) -->
  <rect x="475" y="30" width="225" height="460" rx="8" fill="#181825" stroke="#313244" stroke-width="1.5" />

  <!-- Card Title -->
  <text x="492" y="62" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Triangle Inequality</text>
  <line x1="492" y1="74" x2="683" y2="74" stroke="#45475a" stroke-width="1" />

  <!-- Section 1: Magnitude Square -->
  <text x="492" y="98" fill="#fab387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">1. Vector Magnitude Squared:</text>
  <text x="492" y="120" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">|a + b|² = (a + b) · (a + b)</text>
  <text x="492" y="140" fill="#a6e3a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">= a² + b² + 2(a · b)</text>
  <text x="492" y="160" fill="#a6e3a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">= a² + b² + 2ab cos θ</text>

  <!-- Section 2: Algebraic Sum Square -->
  <line x1="492" y1="180" x2="683" y2="180" stroke="#313244" stroke-width="1" />
  <text x="492" y="204" fill="#fab387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">2. Sum of Magnitudes:</text>
  <text x="492" y="226" fill="#89b4fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">(a + b)² = a² + b² + 2ab</text>

  <!-- Section 3: Comparison -->
  <line x1="492" y1="246" x2="683" y2="246" stroke="#313244" stroke-width="1" />
  <text x="492" y="270" fill="#fab387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">3. Comparison &amp; Bound:</text>
  <text x="492" y="292" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Since cos θ ≤ 1 for all θ:</text>
  <text x="492" y="312" fill="#f38ba8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">2ab cos θ ≤ 2ab</text>
  <text x="492" y="334" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">⟹ |a + b|² ≤ (a + b)²</text>

  <!-- Highlight Result Box -->
  <rect x="487" y="352" width="201" height="80" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5" />
  <text x="500" y="376" fill="#fab387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Taking Square Roots:</text>
  <text x="500" y="400" fill="#a6e3a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">|a + b| ≤ a + b</text>
  <text x="500" y="418" fill="#89b4fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Shortest distance: straight line</text>

  <!-- Bottom Buffer Note -->
  <text x="492" y="468" fill="#6c7086" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Geometric: Euclidean 3rd side bound</text>
</svg>

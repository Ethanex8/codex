<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="100%" height="auto" style="background-color: #1e1e2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow markers -->
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9399b2" />
    </marker>
    <marker id="arrow-face" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#89b4fa" />
    </marker>
    <marker id="arrow-body" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f38ba8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" fill="#cdd6f4" font-size="19" font-weight="600">Cube Diagonals: Body Diagonal vs. Face Diagonal</text>

  <!-- Coordinate Axes from Origin O(220, 360) -->
  <!-- Z axis (vertical up) -->
  <line x1="220" y1="360" x2="220" y2="70" stroke="#9399b2" stroke-width="1.8" marker-end="url(#arrow-axis)" />
  <text x="205" y="65" fill="#cdd6f4" font-size="18" font-style="italic" font-weight="bold">z</text>

  <!-- Y axis (horizontal right) -->
  <line x1="220" y1="360" x2="560" y2="360" stroke="#9399b2" stroke-width="1.8" marker-end="url(#arrow-axis)" />
  <text x="575" y="365" fill="#cdd6f4" font-size="18" font-style="italic" font-weight="bold">y</text>

  <!-- X axis (down-left projection) -->
  <line x1="220" y1="360" x2="70" y2="465" stroke="#9399b2" stroke-width="1.8" marker-end="url(#arrow-axis)" />
  <text x="55" y="480" fill="#cdd6f4" font-size="18" font-style="italic" font-weight="bold">x</text>

  <!--
    Cube Vertices:
    O(0,0,0)   = (220, 360)
    X(1,0,0)   = (110, 437)
    Y(0,1,0)   = (460, 360)
    Z(0,0,1)   = (220, 120)
    XY(1,1,0)  = (350, 437)  [Bottom face opposite corner]
    XZ(1,0,1)  = (110, 197)
    YZ(0,1,1)  = (460, 120)
    XYZ(1,1,1) = (350, 197)  [Top face opposite corner]
  -->

  <!-- Shaded Bottom Face (z = 0) -->
  <polygon points="220,360 110,437 350,437 460,360" fill="#89b4fa" fill-opacity="0.10" stroke="#585b70" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- Shaded Internal Diagonal Slice Triangle: O(220,360) - XY(350,437) - XYZ(350,197) -->
  <polygon points="220,360 350,437 350,197" fill="#fab387" fill-opacity="0.22" stroke="#fab387" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Cube Edges (Background / Hidden) -->
  <!-- Top Face Edges -->
  <line x1="220" y1="120" x2="110" y2="197" stroke="#6c7086" stroke-width="1.8" />
  <line x1="110" y1="197" x2="350" y2="197" stroke="#6c7086" stroke-width="1.8" />
  <line x1="350" y1="197" x2="460" y2="120" stroke="#6c7086" stroke-width="1.8" />
  <line x1="460" y1="120" x2="220" y2="120" stroke="#6c7086" stroke-width="1.8" />

  <!-- Vertical Edges -->
  <line x1="110" y1="437" x2="110" y2="197" stroke="#6c7086" stroke-width="1.8" />
  <line x1="460" y1="360" x2="460" y2="120" stroke="#6c7086" stroke-width="1.8" />
  <line x1="350" y1="437" x2="350" y2="197" stroke="#a6e3a1" stroke-width="2.5" /> <!-- Right vertical leg of triangle -->

  <!-- Bottom Front Edges -->
  <line x1="110" y1="437" x2="350" y2="437" stroke="#6c7086" stroke-width="1.8" />

  <!-- Right angle indicator at XY(350, 437) between face diagonal and z-edge -->
  <path d="M 333 427 L 333 408 L 350 418" fill="none" stroke="#fab387" stroke-width="1.5" />

  <!-- Vector: Face Diagonal d_face from O(220, 360) to XY(350, 437) -->
  <line x1="220" y1="360" x2="345" y2="434" stroke="#89b4fa" stroke-width="3.5" marker-end="url(#arrow-face)" />
  <text x="290" y="425" fill="#89b4fa" font-size="16" font-weight="bold">d<tspan dy="3" font-size="12">face</tspan><tspan dy="-3"> = (1, 1, 0)</tspan></text>

  <!-- Vector: Body Diagonal d_body from O(220, 360) to XYZ(350, 197) -->
  <line x1="220" y1="360" x2="347" y2="202" stroke="#f38ba8" stroke-width="3.5" marker-end="url(#arrow-body)" />
  <text x="210" y="260" fill="#f38ba8" font-size="16" font-weight="bold">d<tspan dy="3" font-size="12">body</tspan><tspan dy="-3"> = (1, 1, 1)</tspan></text>

  <!-- Vertical Leg label: z-edge -->
  <text x="365" y="320" fill="#a6e3a1" font-size="15" font-weight="bold">Δz = 1</text>

  <!-- Angle arc θ at Origin between d_face and d_body -->
  <path d="M 252 340 A 40 40 0 0 1 254 380" fill="none" stroke="#fab387" stroke-width="2.2" />
  <text x="268" y="365" fill="#fab387" font-size="18" font-weight="bold">θ</text>

  <!-- Vertex Markers & Coordinates -->
  <circle cx="220" cy="360" r="4.5" fill="#cdd6f4" />
  <text x="145" y="360" fill="#cdd6f4" font-size="13">(0, 0, 0)</text>

  <circle cx="350" cy="437" r="4.5" fill="#89b4fa" />
  <text x="360" y="452" fill="#89b4fa" font-size="13">(1, 1, 0)</text>

  <circle cx="350" cy="197" r="4.5" fill="#f38ba8" />
  <text x="360" y="195" fill="#f38ba8" font-size="13">(1, 1, 1)</text>

  <!-- Explanatory formula box in top right -->
  <rect x="495" y="65" width="205" height="110" rx="8" fill="#181825" stroke="#313244" stroke-width="1.5" />
  <text x="510" y="92" fill="#fab387" font-size="14" font-weight="bold">Scalar Product Formula:</text>
  <text x="510" y="117" fill="#cdd6f4" font-size="13">d<tspan dy="2" font-size="10">body</tspan><tspan dy="-2"> · d</tspan><tspan dy="2" font-size="10">face</tspan><tspan dy="-2"> = 2</tspan></text>
  <text x="510" y="140" fill="#cdd6f4" font-size="13">|d<tspan dy="2" font-size="10">body</tspan><tspan dy="-2">| = √3,  |d</tspan><tspan dy="2" font-size="10">face</tspan><tspan dy="-2">| = √2</tspan></text>
  <text x="510" y="163" fill="#a6e3a1" font-size="13" font-weight="600">cos θ = √(2/3) ≈ 35.3°</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825" />
      <stop offset="100%" stop-color="#1e1e2e" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#89b4fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a6e3a1" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f38ba8" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9399b2" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fab387" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 18px; fill: #cdd6f4; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #a6adc8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #89b4fa; }
    .math-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #cdd6f4; }
    .math-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: bold; }
    .sub-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #bac2de; }
    .angle-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-style: italic; }
  </style>

  <!-- Canvas Background -->
  <rect width="720" height="520" rx="16" fill="url(#bgGrad)" />
  <rect width="718" height="518" x="1" y="1" rx="15" fill="none" stroke="#313244" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(35, 40)">
    <text class="title" x="0" y="0">Elliptic Helix Kinematics in 3D</text>
    <text class="subtitle" x="0" y="20">r(t) = b cos(ωt) x&#770; + c sin(ωt) y&#770; + v&#x2080;t z&#770;</text>
  </g>

  <!-- Left: 3D Geometry Area -->
  <g id="geometry">
    <!-- Cylinder Guides (dashed) -->
    <line x1="121.9" y1="434.0" x2="121.9" y2="185.0" stroke="#313244" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="268.1" y1="366.0" x2="268.1" y2="155.0" stroke="#313244" stroke-width="1.2" stroke-dasharray="4,4" />

    <!-- Base Ellipse at z = 0 (xy plane) -->
    <path d="M 121.9,434.0 L 127.0,435.7 L 132.9,437.0 L 139.4,437.9 L 146.5,438.4 L 154.2,438.4 L 162.3,438.1 L 170.8,437.3 L 179.5,436.1 L 188.4,434.5 L 197.4,432.6 L 206.4,430.3 L 215.2,427.6 L 223.8,424.7 L 232.1,421.5 L 240.0,418.0 L 247.4,414.3 L 254.2,410.5 L 260.4,406.6 L 265.8,402.6 L 270.5,398.6 L 274.4,394.6 L 277.4,390.6 L 279.4,386.8 L 280.6,383.1 L 280.8,379.6 L 280.1,376.3 L 278.4,373.2 L 275.9,370.5 L 272.4,368.1 L 268.1,366.0 L 263.0,364.3 L 257.1,363.0 L 250.6,362.1 L 243.5,361.6 L 235.8,361.6 L 227.7,361.9 L 219.2,362.7 L 210.5,363.9 L 201.6,365.5 L 192.6,367.4 L 183.6,369.7 L 174.8,372.4 L 166.2,375.3 L 157.9,378.5 L 150.0,382.0 L 142.6,385.7 L 135.8,389.5 L 129.6,393.4 L 124.2,397.4 L 119.5,401.4 L 115.6,405.4 L 112.6,409.4 L 110.6,413.2 L 109.4,416.9 L 109.2,420.4 L 109.9,423.7 L 111.6,426.8 L 114.1,429.5 L 117.6,431.9 L 121.9,434.0"
          fill="#313244" fill-opacity="0.22" stroke="#45475a" stroke-width="1.4" stroke-dasharray="3,3" />

    <!-- 3D Coordinate Axes from Origin O(195.0, 400.0) -->
    <!-- X-axis -->
    <line x1="195.0" y1="400.0" x2="96.1" y2="446.0" stroke="#9399b2" stroke-width="1.3" marker-end="url(#arrow-muted)" />
    <text class="sub-label" x="86" y="455">x</text>

    <!-- Y-axis -->
    <line x1="195.0" y1="400.0" x2="267.0" y2="428.8" stroke="#9399b2" stroke-width="1.3" marker-end="url(#arrow-muted)" />
    <text class="sub-label" x="274" y="435">y</text>

    <!-- Z-axis (vertical up) -->
    <line x1="195.0" y1="400.0" x2="195.0" y2="135.0" stroke="#9399b2" stroke-width="1.3" marker-end="url(#arrow-muted)" />
    <text class="sub-label" x="190" y="125">z</text>
    <text class="sub-label" x="180" y="414">O</text>

    <!-- Helical Trajectory Curve -->
    <path d="M 121.9,434.0 L 127.4,433.7 L 133.8,433.0 L 140.9,431.9 L 148.8,430.2 L 157.2,428.1 L 166.1,425.4 L 175.3,422.3 L 184.9,418.7 L 194.5,414.7 L 204.1,410.3 L 213.7,405.4 L 223.0,400.3 L 231.9,394.8 L 240.4,389.0 L 248.3,383.0 L 255.5,376.8 L 262.0,370.5 L 267.6,364.1 L 272.3,357.7 L 276.0,351.4 L 278.7,345.1 L 280.3,339.0 L 280.8,333.1 L 280.3,327.4 L 278.7,322.1 L 276.0,317.0 L 272.3,312.4 L 267.6,308.1 L 262.0,304.3 L 255.6,300.9 L 248.4,298.0 L 240.5,295.6 L 232.0,293.7 L 223.1,292.2 L 213.8,291.3 L 204.2,290.8 L 194.6,290.7 L 185.0,291.1 L 175.4,291.8 L 166.2,292.9 L 157.3,294.3 L 148.9,296.0 L 141.0,297.9 L 133.9,300.0 L 127.5,302.2 L 122.0,304.4 L 117.4,306.7 L 113.7,308.9 L 111.1,311.0 L 109.6,313.0 L 109.2,314.8 L 109.8,316.3 L 111.5,317.5 L 114.3,318.4 L 118.1,318.9 L 122.9,319.0 L 128.5,318.6 L 135.1,317.9 L 142.3,316.6 L 150.3,314.8 L 158.8,312.6 L 167.8,309.9 L 177.1,306.7 L 186.6,303.0 L 196.3,298.9 L 205.9,294.4 L 215.4,289.5 L 224.7,284.3 L 233.5,278.7 L 241.9,272.9 L 249.7,266.8 L 256.8,260.6 L 263.1,254.3 L 268.5,247.9 L 273.0,241.5 L 276.6,235.2 L 279.0,229.0 L 280.5,222.9 L 280.8,217.0 L 280.1,211.4 L 278.3,206.1 L 275.4,201.1 L 271.5,196.6 L 266.7,192.4 L 260.9,188.6 L 254.3,185.3 L 246.9,182.5 L 238.9,180.2 L 230.4,178.4 L 221.4,177.0 L 212.0,176.1 L 202.5,175.7 L 192.8,175.7 L 183.2,176.2 L 173.7,177.0 L 164.5,178.1 L 155.7,179.6 L 147.4,181.3 L 139.6,183.3 L 132.6,185.4 L 126.4,187.6 L 121.0,189.8 L 116.6,192.1 L 113.2,194.3 L 110.8,196.4 L 109.4,198.3 L 109.2,200.1 L 110.0,201.5 L 112.0,202.7 L 114.9,203.5 L 118.9,203.9 L 123.8,204.0 L 129.7,203.5 L 136.4,202.7 L 143.8,201.3 L 151.8,199.5 L 160.5,197.1 L 169.5,194.3 L 178.9,191.0 L 188.4,187.3"
          fill="none" stroke="#fab387" stroke-width="2.6" />

    <!-- Vertical Pitch Indicator on the left between turn 1 and turn 2 -->
    <!-- From z=115 (y=285) to z=230 (y=170) on left outer guide x=85 -->
    <line x1="85.0" y1="285.0" x2="85.0" y2="170.0" stroke="#6c7086" stroke-width="1.2" stroke-dasharray="2,2" />
    <line x1="80.0" y1="285.0" x2="90.0" y2="285.0" stroke="#6c7086" stroke-width="1.2" />
    <line x1="80.0" y1="170.0" x2="90.0" y2="170.0" stroke="#6c7086" stroke-width="1.2" />
    <text class="sub-label" x="22" y="232" fill="#fab387">Pitch = 2πv&#x2080;/ω</text>

    <!-- Horizontal Plane / Axis Height Guide to Particle P (z = z_P) -->
    <!-- Center on z-axis at height z_P = (195.0, 256.0) -->
    <line x1="195.0" y1="256.0" x2="240.0" y2="274.2" stroke="#6c7086" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Position Vector r(t) from Origin to Particle P(240.0, 274.2) -->
    <line x1="195.0" y1="400.0" x2="237.5" y2="280.0" stroke="#89b4fa" stroke-width="2.8" marker-end="url(#arrow-blue)" />
    <text class="math-label" x="226" y="348" fill="#89b4fa">r(t)</text>

    <!-- Velocity Vector v(t) at P: points upward-right along tangent to helix -->
    <!-- From (240.0, 274.2) to (291.2, 237.6) -->
    <line x1="240.0" y1="274.2" x2="286.0" y2="241.0" stroke="#a6e3a1" stroke-width="3.2" marker-end="url(#arrow-green)" />
    <text class="math-label" x="294" y="235" fill="#a6e3a1">v(t)</text>

    <!-- Acceleration Vector a(t) at P: points horizontally inward toward the z-axis -->
    <!-- From (240.0, 274.2) to (201.7, 258.9) -->
    <line x1="240.0" y1="274.2" x2="206.0" y2="260.5" stroke="#f38ba8" stroke-width="3.2" marker-end="url(#arrow-red)" />
    <text class="math-label" x="195" y="248" fill="#f38ba8">a(t)</text>

    <!-- Particle Dot at P -->
    <circle cx="240.0" cy="274.2" r="5.5" fill="#cdd6f4" stroke="#11111b" stroke-width="1.5" />
    <text class="sub-label" x="248" y="286" fill="#cdd6f4" font-weight="bold">P(t)</text>
  </g>

  <!-- Right Side Card Panel (x = 435 to 695, w = 260) -->
  <g transform="translate(435, 75)">
    <rect width="260" height="425" rx="12" fill="#1e1e2e" stroke="#45475a" stroke-width="1.5" />

    <!-- Card Header -->
    <rect width="260" height="38" rx="12" fill="#252538" />
    <rect width="260" height="15" y="23" fill="#252538" />
    <line x1="0" y1="38" x2="260" y2="38" stroke="#45475a" stroke-width="1" />
    <text class="card-title" x="16" y="24">Helical Orbit Analysis</text>

    <!-- Card Content -->
    <g transform="translate(14, 52)">
      <!-- Step 1: Geometry -->
      <text class="sub-label" x="0" y="0">1. Spatial Trajectory</text>
      <text class="math-text" x="6" y="18" fill="#89b4fa">(x/b)² + (y/c)² = 1,   z = v&#x2080;t</text>
      <text class="sub-label" x="6" y="34" fill="#9399b2">• Elliptic cylinder in xy plane</text>
      <text class="sub-label" x="6" y="49" fill="#9399b2">• Constant vertical velocity along z</text>
      <text class="sub-label" x="6" y="64" fill="#9399b2">• Shape: Elliptic Helix</text>

      <!-- Step 2: Velocity -->
      <text class="sub-label" x="0" y="88">2. Velocity Vector</text>
      <text class="math-text" x="6" y="106" fill="#a6e3a1">v(t) = dr/dt</text>
      <text class="math-text" x="6" y="124" fill="#a6e3a1" font-size="12.5px">v = −ωb sin(ωt) x&#770; + ωc cos(ωt) y&#770; + v&#x2080; z&#770;</text>
      <text class="sub-label" x="6" y="141" fill="#9399b2">• Tangent to 3D helix path</text>
      <text class="sub-label" x="6" y="156" fill="#9399b2" font-size="12px">• Speed varies with curvature</text>

      <!-- Step 3: Acceleration -->
      <text class="sub-label" x="0" y="180">3. Acceleration Vector</text>
      <text class="math-text" x="6" y="198" fill="#f38ba8">a(t) = dv/dt = d²r/dt²</text>
      <text class="math-text" x="6" y="216" fill="#f38ba8" font-size="12.5px">a(t) = −ω² [b cos(ωt) x&#770; + c sin(ωt) y&#770;]</text>
      <text class="sub-label" x="6" y="233" fill="#9399b2">• a_z = 0 (no vertical acceleration)</text>
      <text class="sub-label" x="6" y="248" fill="#9399b2">• Directed inward toward z-axis</text>

      <!-- Divider -->
      <line x1="0" y1="260" x2="232" y2="260" stroke="#313244" stroke-width="1.2" />

      <!-- Step 4: Helix Properties -->
      <text class="sub-label" x="0" y="278" fill="#fab387">4. Motion Characteristics</text>
      <text class="sub-label" x="6" y="296">• Period: T = 2π / ω</text>
      <text class="sub-label" x="6" y="312">• Pitch: Δz = v&#x2080;T = 2πv&#x2080; / ω</text>
      <text class="sub-label" x="6" y="328">• Circular helix if b = c</text>

      <!-- Highlight Box -->
      <rect x="0" y="338" width="232" height="26" rx="5" fill="#313244" stroke="#fab387" stroke-width="0.8" />
      <text class="math-text" x="12" y="355" fill="#fab387" font-size="12px">Elliptic Helix, Pitch = 2πv&#x2080;/ω</text>
    </g>
  </g>
</svg>

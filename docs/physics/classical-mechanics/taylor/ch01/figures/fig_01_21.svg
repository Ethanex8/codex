<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520">
  <!-- Solid Background Invariant -->
  <rect width="720" height="520" fill="#1e1e2e" />

  <defs>
    <!-- Vector Arrowheads -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#89b4fa" />
    </marker>
    <marker id="arrow-peach" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fab387" />
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f9e2af" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a6e3a1" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f38ba8" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9399b2" />
    </marker>
  </defs>

  <!-- ================= LEFT REGION: 3D PARALLELEPIPED ================= -->

  <!-- Shaded Base Parallelogram: O(100, 360), B(260, 385), D(340, 330), C(180, 305) -->
  <polygon points="100,360 260,385 340,330 180,305" fill="#fab387" fill-opacity="0.12" stroke="#6c7086" stroke-width="1" />

  <!-- Shaded Top Parallelogram: A(150, 160), B'(310, 185), D'(390, 130), C'(230, 105) -->
  <polygon points="150,160 310,185 390,130 230,105" fill="#89b4fa" fill-opacity="0.08" stroke="#89b4fa" stroke-width="1.2" />

  <!-- Hidden/Interior Edges (dashed) -->
  <line x1="180" y1="305" x2="340" y2="330" stroke="#6c7086" stroke-width="1.2" stroke-dasharray="4,4" />
  <line x1="180" y1="305" x2="230" y2="105" stroke="#6c7086" stroke-width="1.2" stroke-dasharray="4,4" />

  <!-- Vector c from O(100, 360) to C(180, 305) (dashed baseline) -->
  <line x1="100" y1="360" x2="176" y2="308" stroke="#f9e2af" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-yellow)" />
  <text x="142" y="322" fill="#f9e2af" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" text-anchor="end">c</text>

  <!-- Visible Parallelepiped Outer Edges -->
  <line x1="260" y1="385" x2="340" y2="330" stroke="#6c7086" stroke-width="1.5" />
  <line x1="260" y1="385" x2="310" y2="185" stroke="#6c7086" stroke-width="1.5" />
  <line x1="340" y1="330" x2="390" y2="130" stroke="#6c7086" stroke-width="1.5" />

  <!-- Vector b from O(100, 360) to B(260, 385) -->
  <line x1="100" y1="360" x2="256" y2="384" stroke="#fab387" stroke-width="2.5" marker-end="url(#arrow-peach)" />
  <text x="185" y="406" fill="#fab387" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" text-anchor="middle">b</text>

  <!-- Normal Vector n = b x c from O(100, 360) to (76, 96) -->
  <line x1="100" y1="360" x2="78" y2="102" stroke="#a6e3a1" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="68" y="92" fill="#a6e3a1" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" text-anchor="end">b × c</text>

  <!-- Vector a from O(100, 360) to A(150, 160) -->
  <line x1="100" y1="360" x2="148" y2="166" stroke="#89b4fa" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <text x="135" y="250" fill="#89b4fa" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" text-anchor="end">a</text>

  <!-- Projection of A(150, 160) onto normal line: Foot at (82, 166) -->
  <line x1="150" y1="160" x2="82" y2="166" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Right angle mark at (82, 166) -->
  <polyline points="83,178 93,177 92,165" fill="none" stroke="#9399b2" stroke-width="1" />

  <!-- Height dimension indicator along normal: O(100, 360) to (82, 166) -->
  <line x1="62" y1="357" x2="44" y2="169" stroke="#f38ba8" stroke-width="1.5" />
  <polyline points="66,357 58,357" stroke="#f38ba8" stroke-width="1.5" />
  <polyline points="48,169 40,169" stroke="#f38ba8" stroke-width="1.5" />
  <text x="42" y="268" fill="#f38ba8" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" text-anchor="end">h = |a · n̂|</text>

  <!-- Origin Marker & Label -->
  <circle cx="100" cy="360" r="4" fill="#cdd6f4" />
  <text x="82" y="380" fill="#cdd6f4" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" text-anchor="end">O</text>

  <!-- Base Area Callout -->
  <text x="245" y="345" fill="#fab387" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" text-anchor="middle">Base Area = |b × c|</text>

  <!-- ================= RIGHT REGION: STREAMLINED CARD ================= -->
  <g transform="translate(480, 70)">
    <!-- Card Frame -->
    <rect width="215" height="375" rx="8" fill="#181825" stroke="#313244" stroke-width="1.5" />

    <!-- Card Header -->
    <rect width="215" height="38" rx="8" fill="#313244" />
    <text x="107.5" y="24" fill="#cdd6f4" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" text-anchor="middle">PARALLELEPIPED</text>

    <!-- Base Area -->
    <text x="18" y="70" fill="#fab387" font-family="'Fira Code', monospace" font-size="11.5" font-weight="bold">Base Area</text>
    <text x="22" y="94" fill="#cdd6f4" font-family="'Fira Code', monospace" font-size="11.5">A_base = |b × c|</text>

    <!-- Perpendicular Height -->
    <line x1="18" y1="116" x2="197" y2="116" stroke="#313244" stroke-width="1" />
    <text x="18" y="140" fill="#fab387" font-family="'Fira Code', monospace" font-size="11.5" font-weight="bold">Height</text>
    <text x="22" y="164" fill="#f38ba8" font-family="'Fira Code', monospace" font-size="11.5">h = |a · n̂|</text>
    <text x="22" y="188" fill="#a6adc8" font-family="'Fira Code', monospace" font-size="10.5">n̂ = (b × c) / |b × c|</text>

    <!-- Volume -->
    <line x1="18" y1="210" x2="197" y2="210" stroke="#313244" stroke-width="1" />
    <text x="18" y="234" fill="#fab387" font-family="'Fira Code', monospace" font-size="11.5" font-weight="bold">Volume</text>
    <text x="22" y="258" fill="#cdd6f4" font-family="'Fira Code', monospace" font-size="11.5">V = A_base × h</text>

    <!-- Result Box -->
    <rect x="14" y="284" width="187" height="54" rx="6" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1.5" />
    <text x="107.5" y="317" fill="#89b4fa" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" text-anchor="middle">V = |a · (b × c)|</text>
  </g>
</svg>

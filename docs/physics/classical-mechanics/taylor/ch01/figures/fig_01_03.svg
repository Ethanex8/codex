<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9399b2" />
    </marker>
    <marker id="arrow-vector" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f38ba8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="520" fill="#1e1e2e" />

  <!-- Title / Legend header -->
  <text x="360" y="38" text-anchor="middle" fill="#cdd6f4" font-size="19" font-weight="600">3D Pythagorean Theorem: Two-Step Decomposition</text>

  <!-- Coordinate Axes from Origin O(230, 370) -->
  <!-- Z axis (vertical up) -->
  <line x1="230" y1="370" x2="230" y2="70" stroke="#9399b2" stroke-width="2" marker-end="url(#arrow)" />
  <text x="220" y="65" fill="#cdd6f4" font-size="18" font-style="italic" font-weight="bold">z</text>

  <!-- Y axis (horizontal right) -->
  <line x1="230" y1="370" x2="630" y2="370" stroke="#9399b2" stroke-width="2" marker-end="url(#arrow)" />
  <text x="645" y="375" fill="#cdd6f4" font-size="18" font-style="italic" font-weight="bold">y</text>

  <!-- X axis (down-left projection at 135 deg: dx = -140, dy = 100) -->
  <line x1="230" y1="370" x2="100" y2="465" stroke="#9399b2" stroke-width="2" marker-end="url(#arrow)" />
  <text x="85" y="480" fill="#cdd6f4" font-size="18" font-style="italic" font-weight="bold">x</text>

  <!-- Points definitions:
       O = (230, 370)
       X-component point X_proj = (150, 428)  [x along x-axis]
       Y-component point Y_proj = (490, 370)  [y along y-axis]
       Q (xy projection) = (410, 428) [from O + x_vec + y_vec]
       P (3D point) = (410, 160) [Q shifted up by z = 268]
  -->

  <!-- Shaded XY Plane Triangle (Step 1) -->
  <polygon points="230,370 150,428 410,428" fill="#89b4fa" fill-opacity="0.18" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Shaded Vertical Triangle O-Q-P (Step 2) -->
  <polygon points="230,370 410,428 410,160" fill="#a6e3a1" fill-opacity="0.22" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- XY box helper guides -->
  <line x1="230" y1="370" x2="490" y2="370" stroke="#585b70" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="490" y1="370" x2="410" y2="428" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Leg x: along x-axis from O(230, 370) to (150, 428) -->
  <line x1="230" y1="370" x2="150" y2="428" stroke="#89b4fa" stroke-width="2.5" />
  <text x="175" y="395" fill="#89b4fa" font-size="16" font-weight="bold">x</text>

  <!-- Leg y: parallel to y-axis from (150, 428) to Q(410, 428) -->
  <line x1="150" y1="428" x2="410" y2="428" stroke="#89b4fa" stroke-width="2.5" />
  <text x="280" y="450" fill="#89b4fa" font-size="16" font-weight="bold">y</text>

  <!-- Right angle marker at (150, 428) in xy plane -->
  <path d="M 161 420 L 175 420 L 164 428" fill="none" stroke="#89b4fa" stroke-width="1.5" />

  <!-- Hypotenuse 1 (rho) in xy plane: from O(230, 370) to Q(410, 428) -->
  <line x1="230" y1="370" x2="410" y2="428" stroke="#fab387" stroke-width="3" />
  <text x="325" y="390" fill="#fab387" font-size="17" font-weight="bold">ρ</text>

  <!-- Vertical Leg z: from Q(410, 428) to P(410, 160) -->
  <line x1="410" y1="428" x2="410" y2="160" stroke="#a6e3a1" stroke-width="3" />
  <text x="425" y="295" fill="#a6e3a1" font-size="17" font-weight="bold">z</text>

  <!-- Right angle marker at Q(410, 428) between OQ and QP -->
  <path d="M 392 422 L 392 405 L 410 411" fill="none" stroke="#a6e3a1" stroke-width="1.5" />

  <!-- Vector r (Hypotenuse of Step 2): from O(230, 370) to P(410, 160) -->
  <line x1="230" y1="370" x2="405" y2="166" stroke="#f38ba8" stroke-width="3.5" marker-end="url(#arrow-vector)" />
  <text x="295" y="245" fill="#f38ba8" font-size="20" font-weight="bold">r</text>

  <!-- Points and labels -->
  <!-- Origin O -->
  <circle cx="230" cy="370" r="4.5" fill="#cdd6f4" />
  <text x="205" y="365" fill="#cdd6f4" font-size="16" font-weight="bold">O</text>

  <!-- Point Q(x, y, 0) -->
  <circle cx="410" cy="428" r="4.5" fill="#fab387" />
  <text x="422" y="442" fill="#fab387" font-size="15" font-weight="600">Q(x, y, 0)</text>

  <!-- Point P(x, y, z) -->
  <circle cx="410" cy="160" r="5" fill="#f38ba8" />
  <text x="422" y="155" fill="#f38ba8" font-size="16" font-weight="bold">P(x, y, z)</text>

  <!-- Step annotations box -->
  <rect x="35" y="80" width="175" height="160" rx="8" fill="#181825" stroke="#6c7086" stroke-width="1.5" />
  <text x="48" y="106" fill="#cdd6f4" font-size="14" font-weight="bold">Pythagoras Steps:</text>
  <text x="48" y="132" fill="#89b4fa" font-size="13" font-weight="600">Step 1 (xy-plane):</text>
  <text x="48" y="152" fill="#fab387" font-size="13">ρ² = x² + y²</text>
  <text x="48" y="182" fill="#a6e3a1" font-size="13" font-weight="600">Step 2 (vertical):</text>
  <text x="48" y="202" fill="#f38ba8" font-size="13" font-weight="bold">r² = ρ² + z²</text>
  <text x="48" y="222" fill="#cdd6f4" font-size="12">= x² + y² + z²</text>
</svg>

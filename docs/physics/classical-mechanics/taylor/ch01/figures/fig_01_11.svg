<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#89b4fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a6e3a1" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f38ba8" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9399b2" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fab387" />
    </marker>
  </defs>

  <!-- Deep Mocha Canvas Background -->
  <rect width="720" height="520" fill="#1e1e2e" />

  <!-- Header -->
  <g transform="translate(35, 40)">
    <text x="0" y="0" fill="#cdd6f4" font-size="18px" font-weight="700">Elliptic Orbit Kinematics</text>
    <text x="0" y="20" fill="#a6adc8" font-size="13px">Harmonic motion in 2D: r(t) = b cos(ωt) x̂ + c sin(ωt) ŷ</text>
  </g>

  <!-- Left: Geometry Area (Origin at O(180, 310)) -->
  <!-- Semi-major rx = 135 (b), semi-minor ry = 90 (c) -->
  <g id="geometry">
    <!-- Axes (bounded to x <= 350 for >= 35px buffer to card at 475) -->
    <line x1="35" y1="310" x2="345" y2="310" stroke="#9399b2" stroke-width="1.2" marker-end="url(#arrow-muted)" />
    <line x1="180" y1="465" x2="180" y2="135" stroke="#9399b2" stroke-width="1.2" marker-end="url(#arrow-muted)" />
    <text x="352" y="314" fill="#bac2de" font-size="13px">x</text>
    <text x="176" y="125" fill="#bac2de" font-size="13px">y</text>
    <text x="165" y="325" fill="#bac2de" font-size="13px">O</text>

    <!-- Ellipse Path: rx = 135, ry = 90 -->
    <ellipse cx="180" cy="310" rx="135" ry="90" fill="none" stroke="#45475a" stroke-width="1.8" stroke-dasharray="5,5" />

    <!-- Intercept markers and labels -->
    <text x="318" y="328" fill="#89b4fa" font-size="12px">b</text>
    <text x="45" y="296" fill="#89b4fa" font-size="12px" text-anchor="middle">−b</text>
    <text x="190" y="215" fill="#a6e3a1" font-size="12px">c</text>
    <text x="186" y="415" fill="#a6e3a1" font-size="12px">−c</text>

    <!-- Counterclockwise direction arrow along ellipse -->
    <path d="M 180 220 A 135 90 0 0 0 120 230" fill="none" stroke="#fab387" stroke-width="2" marker-end="url(#arrow-orange)" />
    <text x="145" y="210" fill="#fab387" font-size="14px" font-style="italic">ω</text>

    <!-- Position at t = 0 -->
    <circle cx="315" cy="310" r="3.5" fill="#6c7086" />
    <text x="305" y="298" fill="#9399b2" font-size="12px">t = 0</text>

    <!-- Particle P at phase angle phi = 45 deg (t = pi / 4omega) -->
    <!-- Position vector r(t): from (180, 310) to P(275.5, 246.4) -->
    <line x1="180" y1="310" x2="270" y2="250" stroke="#89b4fa" stroke-width="3" marker-end="url(#arrow-blue)" />
    <text x="215" y="265" fill="#89b4fa" font-size="15px" font-weight="bold" text-anchor="middle">r(t)</text>

    <!-- Component projection lines -->
    <line x1="275.5" y1="246.4" x2="275.5" y2="310" stroke="#6c7086" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="275.5" y1="246.4" x2="180" y2="246.4" stroke="#6c7086" stroke-width="1" stroke-dasharray="3,3" />
    <text x="235" y="328" fill="#89b4fa" font-size="12px" text-anchor="middle">b cos(ωt)</text>
    <text x="172" y="240" fill="#a6e3a1" font-size="12px" text-anchor="end">c sin(ωt)</text>

    <!-- Velocity vector v(t) -->
    <line x1="275.5" y1="246.4" x2="220" y2="210" stroke="#a6e3a1" stroke-width="3" marker-end="url(#arrow-green)" />
    <text x="246" y="215" fill="#a6e3a1" font-size="15px" font-weight="bold">v(t)</text>

    <!-- Acceleration vector a(t): inward toward origin O (slightly offset laterally) -->
    <line x1="277.4" y1="249.3" x2="226" y2="283" stroke="#f38ba8" stroke-width="3" marker-end="url(#arrow-red)" />
    <text x="285" y="280" fill="#f38ba8" font-size="15px" font-weight="bold" text-anchor="start">a(t)</text>

    <!-- Particle dot at P -->
    <circle cx="275.5" cy="246.4" r="5" fill="#cdd6f4" stroke="#11111b" stroke-width="1.5" />
    <text x="284" y="242" fill="#cdd6f4" font-size="13px" font-weight="bold">P(t)</text>
  </g>

  <!-- Right Side Card Panel ($x \ge 475$, width 225) -->
  <g transform="translate(475, 75)">
    <rect width="225" height="420" rx="8" fill="#181825" stroke="#6c7086" stroke-width="1.5" />

    <!-- Card Header -->
    <text x="16" y="30" fill="#89b4fa" font-size="15px" font-weight="700">Orbital Analysis</text>
    <line x1="16" y1="42" x2="209" y2="42" stroke="#45475a" stroke-width="1" />

    <!-- Card Content -->
    <g transform="translate(16, 58)">
      <!-- Step 1: Trajectory Equation -->
      <text x="0" y="0" fill="#bac2de" font-size="13px" font-weight="600">1. Orbit Geometry (Ellipse)</text>
      <text x="6" y="18" fill="#89b4fa" font-size="12px">x/b = cos(ωt),  y/c = sin(ωt)</text>
      <text x="6" y="34" fill="#89b4fa" font-size="12.5px">(x/b)² + (y/c)² = 1</text>
      <text x="6" y="50" fill="#9399b2" font-size="12px">• Semi-axes: b along x, c along y</text>

      <!-- Step 2: Velocity -->
      <text x="0" y="76" fill="#bac2de" font-size="13px" font-weight="600">2. Velocity Vector</text>
      <text x="6" y="94" fill="#a6e3a1" font-size="12px">v(t) = dr/dt</text>
      <text x="6" y="112" fill="#a6e3a1" font-size="11.5px">v = −ωb sin(ωt) x̂ + ωc cos(ωt) ŷ</text>
      <text x="6" y="128" fill="#9399b2" font-size="12px">• Tangent to ellipse at all t</text>

      <!-- Step 3: Acceleration -->
      <text x="0" y="154" fill="#bac2de" font-size="13px" font-weight="600">3. Acceleration Vector</text>
      <text x="6" y="172" fill="#f38ba8" font-size="12px">a(t) = dv/dt = −ω² r(t)</text>
      <text x="6" y="190" fill="#9399b2" font-size="12px">• Directed inward toward origin O</text>
      <text x="6" y="206" fill="#9399b2" font-size="12px">• Proportional to distance |r|</text>

      <!-- Divider -->
      <line x1="0" y1="220" x2="193" y2="220" stroke="#313244" stroke-width="1.2" />

      <!-- Step 4: Orbital Properties -->
      <text x="0" y="240" fill="#fab387" font-size="13px" font-weight="600">4. Motion Characteristics</text>
      <text x="6" y="258" fill="#9399b2" font-size="12px">• Period: T = 2π / ω</text>
      <text x="6" y="274" fill="#9399b2" font-size="12px">• Degenerates to circle if b = c</text>

      <!-- Highlight Box -->
      <rect x="0" y="288" width="193" height="32" rx="5" fill="#313244" stroke="#fab387" stroke-width="0.8" />
      <text x="8" y="309" fill="#fab387" font-size="12px" font-weight="600">Elliptic Orbit, Period T = 2π/ω</text>
    </g>
  </g>
</svg>

site_name: Codex - Textbook Solutions
site_description: Verified step-by-step solutions to textbook problems.
site_url: https://Ethanex8.github.io/codex/
repo_url: https://github.com/Ethanex8/codex
repo_name: Ethanex8/codex

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Physics:
      - Overview: physics/index.md
      - Classical Mechanics:
          - "Taylor: Classical Mechanics":
              - Overview: physics/classical-mechanics/taylor/index.md
              - Chapter 1 — Newton's Laws:
                  - Problem 1.1: physics/classical-mechanics/taylor/ch01/prob_01_01.md
                  - Problem 1.2: physics/classical-mechanics/taylor/ch01/prob_01_02.md
                  - Problem 1.3: physics/classical-mechanics/taylor/ch01/prob_01_03.md
                  - Problem 1.4: physics/classical-mechanics/taylor/ch01/prob_01_04.md

